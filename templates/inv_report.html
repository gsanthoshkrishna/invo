<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Report</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .page {
            display: flex;
            justify-content: center;   /* center horizontally */
            padding: 40px 20px;
        }

        .card {
            width: 600px;              /* tighter width */
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
            font-size: 26px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th, td {
            padding: 12px 14px;        /* reduced gap */
            font-size: 15px;           /* slightly larger font */
        }

        th {
            font-weight: 600;
        }

        td {
            border-bottom: 1px solid #eaeaea;
        }

        /* Zebra rows */
        tbody tr:nth-child(even) {
            background: #f7f9fc;
        }

        tbody tr:hover {
            background: #eef2ff;
        }

        .count {
            text-align: right;
            font-weight: 600;
        }

        .sort {
            margin-left: 6px;
            font-size: 12px;
            text-decoration: none;
            color: rgba(255,255,255,0.9);
        }

        .sort:hover {
            color: #fff;
        }

        .footer {
            padding: 12px;
            background: #fafafa;
            text-align: center;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

<h1>📦 Inventory Report</h1>

<div class="page">
    <div class="card">

        <table>
            <thead>
                <tr>
                    <th>
                        Item
                        <a class="sort" href="?sort_by=item&order=asc">▲</a>
                        <a class="sort" href="?sort_by=item&order=desc">▼</a>
                    </th>
                    <th class="count">
                        Count
                        <a class="sort" href="?sort_by=count&order=asc">▲</a>
                        <a class="sort" href="?sort_by=count&order=desc">▼</a>
                    </th>
                </tr>
            </thead>

            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item[1] }}</td>
                    <td class="count">{{ item[2] }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="2" style="text-align:center;color:#999;">
                        No inventory data found
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="footer">
            Total records: {{ items|length }}
        </div>

    </div>
</div>

</body>
</html>
