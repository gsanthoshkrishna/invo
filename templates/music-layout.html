<!doctype html>
<html>
<head>
    <title>Flask Flash Words</title>
    <style>
        .flashes { list-style-type: none; padding: 0; }
        .flashes li { padding: 10px; margin-bottom: 5px; border-radius: 5px; background: #d9edf7; color: #31708f; }
    </style>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
