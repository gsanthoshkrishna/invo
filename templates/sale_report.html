<style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    
    tr:nth-child(even) {
      background-color: rgba(150, 212, 212, 0.4);
    }
    
    th:nth-child(even) {
      background-color: rgba(150, 212, 212, 0.4);
    }
    </style>
    <table>
        <tr>
            <th>Date</th><th>Name</th><th>Item</th><th>cost</th><th>price</th><th>Quantity</th>
        </tr>
        {% for item in items %}
        <tr>
            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>
            <td>{{ item[3] }}</td>
            <td>{{ item[4] }}</td>
            <td>{{ item[5] }}</td>
        </tr>
        {% endfor %}
    </table>
    <button onclick="location.href='/home'">Home</button>
