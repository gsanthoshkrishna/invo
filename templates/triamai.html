<!DOCTYPE html>
<html>
<head>
    <title>AI Chat & Content Manager</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 900px;
            margin: 30px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2, h3 {
            margin-top: 0;
            color: #333;
        }

        hr {
            border: none;
            height: 1px;
            background: #eee;
            margin: 25px 0;
        }

        /* Textareas */
        .textarea-group {
            display: flex;
            gap: 15px;
        }

        textarea {
            width: 100%;
            resize: vertical;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Buttons */
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #5a67d8;
        }

        /* Chat box */
        #chat-box {
            height: 260px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            background: #fafafa;
        }

        .user {
            background: #e6f0ff;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: right;
        }

        .bot {
            background: #e6fffa;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        /* Chat input */
        .chat-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .chat-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Upload */
        .upload-section input {
            margin-right: 10px;
        }

        /* Responsive */
        @media (max-width: 960px) {
            .container {
                width: 95%;
            }

            .textarea-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h2>📄 Inventory & DMS Updates</h2>
    <form method="POST" action="/triam-ai">
        <div class="textarea-group">
            <textarea name="content1" rows="15" placeholder="DMS Updates...">{{ dmsupdates }}</textarea>
            <textarea name="content2" rows="15" placeholder="Inventory Points...">{{ invpoints }}</textarea>
        </div>
        <br>
        <button type="submit">💾 Update Content</button>
    </form>

    <hr>

    <h2>💬 AI Chat</h2>
    <div id="chat-box"></div>

    <div class="chat-input">
        <input type="text" id="message" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <hr>

    <h3>📤 Upload File</h3>
    <div class="upload-section">
        <input type="file" id="file">
        <button onclick="uploadFile()">Upload</button>
    </div>

</div>

<script>
function sendMessage() {
    const message = document.getElementById("message").value;
    if (!message) return;

    const chatBox = document.getElementById("chat-box");
    chatBox.innerHTML += `<div class="user"><b>You:</b> ${message}</div>`;

    fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: message })
    })
    .then(res => res.json())
    .then(data => {
        chatBox.innerHTML += `<div class="bot"><b>Bot:</b> ${data.answer}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    document.getElementById("message").value = "";
}

function uploadFile() {
    const fileInput = document.getElementById("file");
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    fetch("/update-ai-doc", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message || data.error);
    });
}
</script>

</body>
</html>
