<!DOCTYPE html>
<html>
<head>
    <title>AI Chat & Content Manager</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* Side-by-side Library & Bucket */
    .side-panel {
        display: flex;
        width: 100%;
        gap: 20px;                 /* space between panels */
        box-sizing: border-box;
    }

    #library,
    #bucket {
        width: 50%;                /* EXACT half */
        box-sizing: border-box;
        background: #f9fafb;
        padding: 12px;
        border-radius: 10px;
        min-height: 260px;
    }


    #library h3,
    #bucket h3 {
        margin-top: 0;
        font-size: 16px;
    }

    /* Common fixed-size button style */
    .library-btn,
    .bucket-btn {
        width: 180px;              /* fixed width */
        height: 44px;              /* fixed height */
        padding: 0 12px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        box-sizing: border-box;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;   /* show ... for long text */
        line-height: 1;
    }



    /* Responsive: stack on small screens */
    @media (max-width: 768px) {
        .side-panel {
            flex-direction: column;
        }
    }


        #library {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .library-btn {
            background: #edf2ff;
            color: #333;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ccc;
            font-size: 13px;
        }

        .notes-window {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 520px;
            height: 420px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .notes-header {
            background: #667eea;
            color: white;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px 10px 0 0;
        }

        .notes-body {
            padding: 10px;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .notes-controls span {
            cursor: pointer;
            margin-left: 8px;
            font-weight: bold;
        }


        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 900px;
            margin: 30px 40px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2, h3 {
            margin-top: 0;
            color: #333;
        }

        hr {
            border: none;
            height: 1px;
            background: #eee;
            margin: 25px 0;
        }

        /* Textareas */
        .textarea-group {
            display: flex;
            gap: 15px;
        }

        textarea {
            width: 100%;
            resize: vertical;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Buttons */
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #5a67d8;
        }

        /* Chat box */
        #chat-box {
            height: 260px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            background: #fafafa;
        }

        .user {
            background: #e6f0ff;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: right;
        }

        .bot {
            background: #e6fffa;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        /* Chat input */
        .chat-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .chat-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Upload */
        .upload-section input {
            margin-right: 10px;
        }

        /* Responsive */
        @media (max-width: 960px) {
            .container {
                width: 95%;
            }

            .textarea-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div id="toast" style="
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: #38a169;
        color: white;
        padding: 10px 14px;
        border-radius: 6px;
        display: none;
        font-size: 14px;
    ">
    </div>
<div class="side-panel">

    <div id="library">
        <h3>📚 Library</h3>
    </div>

    <div id="bucket">
        <h3>🪣 Buckets</h3>
    </div>

</div>

<!-- Notes popup container -->
<div id="notes-area"></div>

    <h2>📄 Investments & DMS Updates</h2>
        <div class="textarea-group">
            <textarea id="content1" name="content1" rows="15" placeholder="DMS Updates..."></textarea>
            <textarea id="content2" name="content2" rows="15" placeholder="Investment Points..."></textarea>
        </div>
        <br>
        
        <button onclick="updatecontents()">💾 Update Content</button>
    
    <hr>

    <h2>💬 AI Chat</h2>
    <div id="chat-box"></div>

    <div class="chat-input">
        <input type="text" id="message" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
    </div>
    <hr>

    <h3>📤 Upload File</h3>
    <div class="upload-section">
        <input type="file" id="file">
        <button onclick="uploadFile()">Upload</button>
    </div>

</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    const notesData = {{ notes | tojson }};
    const bucketsData = {{ buckets | tojson }};
</script>
<script>

function sendMessage() {
    const message = document.getElementById("message").value;
    if (!message) return;

    const chatBox = document.getElementById("chat-box");
    chatBox.innerHTML += `<div class="user"><b>You:</b> ${message}</div>`;

    fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: message })
    })
    .then(res => res.json())
    .then(data => {
        chatBox.innerHTML += `<div class="bot"><b>Bot:</b> ${data.answer}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    document.getElementById("message").value = "";
}

function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.innerText = msg;
    toast.style.display = "block";

    setTimeout(() => {
        toast.style.display = "none";
    }, 700);
}

function updatecontents() {
    const cont1 = document.getElementById("content1").value;
    const cont2 = document.getElementById("content2").value;

      $.ajax({
        type: 'POST',
        url: '/triam-ai',
        data: JSON.stringify({ 'content1': cont1,'content2': cont2,'request_type': 'ajax' }), 
        contentType: 'application/json; charset=utf-8', 
        dataType: 'json',
        success: function(response) {
            if (response.status === 'success') {
                alert('Updated successfully!');                
            }else {
                alert("Update failed");
            }
        }
        });
 
}


function uploadFile() {
    const fileInput = document.getElementById("file");
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    fetch("/update-ai-doc", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message || data.error);
    });
}

function renderLibrary() {
    const lib = document.getElementById("library");
    
    notesData.forEach((note, index) => {
        const btn = document.createElement("div");
        btn.className = "library-btn";
        btn.innerText = note.name;
        btn.onclick = () => openNote(index);
        lib.appendChild(btn);
    });
    console.log(notesData)
}

function renderBuckets() {
    const bktEle = document.getElementById("bucket");
    
    bucketsData.forEach((bucket, index) => {
        const bktBtn = document.createElement("div");
        bktBtn.className = "library-btn";
        bktBtn.innerText = bucket.name;
        bktBtn.onclick = () => openBucket(index);
        bktEle.appendChild(bktBtn);
    });
    console.log(bucketsData)
}

function openNote(index) {
    const note = notesData[index];

    // Prevent duplicate windows
    if (document.getElementById("note-" + index)) return;

    const win = document.createElement("div");
    win.className = "notes-window";
    win.id = "note-" + index;

    win.innerHTML = `
        <div class="notes-header">
            <span>${note.name}</span>
            <div class="notes-controls">
                <span onclick="closeNote(${index})">×</span>
            </div>
        </div>
        <div class="notes-body">${note.content}</div>
    `;

    document.body.appendChild(win);
}

function openBucket(index) {
    const note = bucketsData[index];

    // Prevent duplicate windows
    if (document.getElementById("bkt-" + index)) return;

    const win = document.createElement("div");
    win.className = "notes-window";
    win.id = "bkt-" + index;

    win.innerHTML = `
        <div class="notes-header">
            <span>${note.name}</span>
            <div class="notes-controls">
                <span onclick="closeNote(${index})">×</span>
            </div>
        </div>
        <div class="notes-body">${note.content}</div>
    `;

    document.body.appendChild(win);
}



function restoreNote(index) {
    const tab = document.getElementById("tab-" + index);
    if (tab) tab.remove();
    openNote(index);
}

function closeNote(index) {
    const win = document.getElementById("note-" + index);
    const tab = document.getElementById("tab-" + index);
    if (win) win.remove();
    if (tab) tab.remove();
}


renderLibrary();
renderBuckets();

</script>

</body>
</html>
