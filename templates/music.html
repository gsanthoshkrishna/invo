<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Highlight 10 Icons</title>
    <style>
        .icon-row {
            display: flex;
            gap: 24px;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
        }
        .icon-row img {
            width: 48px;
            height: 48px;
            border: 4px solid transparent;
            border-radius: 8px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .icon-row img.highlighted {
            border-color: #e94e77;
            box-shadow: 0 0 12px #e94e77;
        }
    </style>
</head>
<body>
    <div class="icon-row" id="iconRow">
        {% for icon in icons %}
            <img src="{{ url_for('static', filename=icon) }}" alt="{{ icon }}" />
        {% endfor %}
    </div>

    <script>
        let intvl = {{ intvl }}
        document.addEventListener('DOMContentLoaded', () => {
            const icons = document.querySelectorAll('.icon-row img');
            
            function wait(ms){
                var start = new Date().getTime();
                var end = start;
                while(end < start + ms){
                    end = new Date().getTime();
                }
            }
            function highlightIcon(index) {
                console.log(index)
                console.log(intvl[index])
                wait(intvl[index])
                icons.forEach((icon, idx) => {
                    icon.classList.toggle('highlighted', idx === index);
                });    
            }

            let currentIndex = 0;
            
            function cycleIcons(){
                highlightIcon(currentIndex);
                currentIndex = (currentIndex + 1) % icons.length;
            }

            intervalId = setInterval(cycleIcons, 10);
            cycleIcons();

        });
    </script>
</body>
</html>
