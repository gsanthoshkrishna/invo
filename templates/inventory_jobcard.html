<!DOCTYPE html>
<html>
<head>
    <title>Jobcard Form</title>
    <style>
    .popup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: white;
        padding: 20px;
        border: 1px solid #ccc;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        z-index: 1000;
    }
    .overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 999;
    }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('../static/images/jobcardbg2.png'); /* Replace with your background */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .jobcard-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px 40px;
            border-radius: 10px;
            width: 450px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: #007BFF;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="popupForm" class="popup">
    <form action="/insert-inv-cust" method="POST">
        <label>Mobile:</label>
        <input type="text" id="pCustMob" name="pCustMob" required><br>
        <label for="name" id="pCustnamelbl">Customer Name:</label>
        <input type="text" id="pCustName" name="pCustName" required><br>
        <label for="location">Location:</label>
        <input type="text" id="pCustLoc" name="pCustLoc" required>
        <input type="submit" value="Create">
        <button type="button" onclick="hidePopup()" >Cancel</button>
    </form>
</div>
    <div class="jobcard-container">
        <h2>New Jobcard</h2>
        <form method="POST" action="/submit" enctype="multipart/form-data">
            <label>Customer Number:</label>
            <input type="text" id="mobile" value="{{ inv_cust_mob }}" required>
            <button onclick="getUser()">Search</button>

            <label>Name:</label>
            <input type="text" id="custname" name="name" readonly>
            <input type="text" id="cust_id" name="cust_id" hidden>

            <label>Problem:</label>
            <textarea name="problem" rows="3" required></textarea>

            <label>Remarks:</label>
            <textarea name="remarks" rows="2"></textarea>

            <label>Upload Photo:</label>
            <input type="file" name="photo" accept="image/*">

            <button type="submit">Submit Jobcard</button>
        </form>
    </div>
</body>
</html>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>

function showPopup(){    
    var pCustMob = document.getElementById("pCustMob");
    var tempmob = document.getElementById("mobile");
    pCustMob.value = tempmob.value
    pCustMob.readOnly = true
    document.getElementById("popupForm").style.display = "block"
}

function hidePopup(){
    document.getElementById("popupForm").style.display = "none"
}

function getUser() {
    var mobno = document.getElementById('mobile').value;
    console.log("in ajax call")
    $.ajax({
        type: 'POST',
        url: '/inv-load-transaction',
        data: JSON.stringify({ 'mobile': mobno}), 
        headers: {
        "Content-Type": "application/json"
        }, 
        dataType: 'json',
        success: function(response){
            
            if (response.cust_id == -1){
                console.log("Customer Not Available")
                showPopup()
            }else{
                console.log("Customer Available")
                document.getElementById('custname').value = response.custname;
                document.getElementById('cust_id').value = response.cust_id;   
            }
        } 
    });
}

</script>
